<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rodokmen Forejtníků</title>
<meta http-equiv="refresh" content="0; url=web/">
<script>
  var target = 'web/' + (window.location.hash || '');
  window.location.replace(target);
</script>
<style>
  body {
    font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f2ece1;
    color: #181411;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    padding: 1rem;
    box-sizing: border-box;
  }
  .box {
    text-align: center;
    padding: 2.2rem;
    border: 2px solid #181411;
    background: #faf6ee;
    box-shadow: 6px 6px 0 rgba(24, 20, 17, 0.18);
    max-width: 440px;
    width: 100%;
  }
  h2 {
    font-family: Georgia, serif;
    margin: 0 0 0.5rem;
    font-size: 1.6rem;
  }
  p {
    margin: 0.5rem 0 1rem;
    font-size: 0.95rem;
    color: #433932;
  }
  a {
    display: inline-block;
    padding: 0.65rem 1.2rem;
    background: #7c1f28;
    color: #fff;
    text-decoration: none;
    font-family: monospace;
    font-weight: 600;
    font-size: 0.85rem;
    letter-spacing: 0.05em;
  }
  a:hover {
    background: #5d151d;
  }
</style>
</head>
<body>
<div class="box">
  <h2>Rodokmen Forejtníků</h2>
  <p>Přesměrovávám do rodinného archivu…</p>
  <p><a href="web/">Vstoupit přímo ↗</a></p>
</div>
</body>
</html>
