version: '3.8'
services:
  rodokmen:
    image: nginx:stable-alpine
    container_name: rodokmen
    network_mode: host
    restart: unless-stopped
    volumes:
      - /volume1/docker/rodokmen/html:/usr/share/nginx/html:ro
      - /volume1/docker/rodokmen/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /volume1/docker/rodokmen/htpasswd:/etc/nginx/rodokmen.htpasswd:ro
